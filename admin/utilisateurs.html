<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Utilisateurs</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<style>
  .drawer{position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100vh;background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.12);transition:right .2s var(--ease);z-index:300;overflow-y:auto;padding:24px}
  .drawer.open{right:0}
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:290;display:none}
  .drawer-overlay.open{display:block}
  .drawer .close{position:absolute;top:20px;right:20px;background:none;border:none;font-size:1.3rem;cursor:pointer}
</style>
</head>
<body>
<template id="page-content">
  <div class="page-head">
    <div><h1>Utilisateurs</h1><p id="count-label"></p></div>
    <button class="btn btn-primary" id="btn-new" hidden>+ Nouvel utilisateur</button>
  </div>
  <div class="card" style="padding:0;overflow-x:auto">
    <table>
      <thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Statut</th><th>Dernière connexion</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</template>

<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer"><button class="close" id="drawer-close">✕</button><div id="drawer-content"></div></div>

<script src="js/app.js"></script>
<script>
let admin, lookups, users = [];

function formHtml(u = {}, passwordOptional) {
  return `
    <div class="alert error" id="form-error" hidden></div>
    <div class="form-row">
      <div class="form-field"><label>Prénom *</label><input id="f-firstName" value="${escapeHtml(u.first_name||"")}" required></div>
      <div class="form-field"><label>Nom *</label><input id="f-lastName" value="${escapeHtml(u.last_name||"")}" required></div>
    </div>
    <div class="form-field"><label>Email *</label><input id="f-email" type="email" value="${escapeHtml(u.email||"")}" required></div>
    <div class="form-field"><label>Téléphone</label><input id="f-phone" value="${escapeHtml(u.phone||"")}"></div>
    <div class="form-row">
      <div class="form-field"><label>Rôle *</label><select id="f-role">${lookups.roles.map(r => `<option value="${r.id}" ${u.role_id===r.id?"selected":""}>${escapeHtml(r.label)}</option>`).join("")}</select></div>
      <div class="form-field"><label>Statut</label><select id="f-status"><option value="ACTIVE" ${!u.status||u.status==="ACTIVE"?"selected":""}>Actif</option><option value="INACTIVE" ${u.status==="INACTIVE"?"selected":""}>Inactif</option><option value="SUSPENDED" ${u.status==="SUSPENDED"?"selected":""}>Suspendu</option></select></div>
    </div>
    <div class="form-field"><label>${passwordOptional?"Nouveau mot de passe (laisser vide pour ne pas changer)":"Mot de passe initial *"}</label><input id="f-password" type="password" minlength="8" ${passwordOptional?"":"required"}></div>
    <button class="btn btn-primary" id="save-btn" style="width:100%">Enregistrer</button>
  `;
}
function readForm() {
  return {
    firstName: document.getElementById("f-firstName").value, lastName: document.getElementById("f-lastName").value,
    email: document.getElementById("f-email").value, phone: document.getElementById("f-phone").value,
    roleId: document.getElementById("f-role").value, status: document.getElementById("f-status").value,
    password: document.getElementById("f-password").value,
  };
}
function openDrawer() { document.getElementById("drawer").classList.add("open"); document.getElementById("drawer-overlay").classList.add("open"); }
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); document.getElementById("drawer-overlay").classList.remove("open"); }

function openNew() {
  document.getElementById("drawer-content").innerHTML = `<h2>Nouvel utilisateur</h2>` + formHtml({}, false);
  openDrawer();
  document.getElementById("save-btn").addEventListener("click", async () => {
    const { res, data } = await adminApi("/api/admin/users", { method: "POST", body: JSON.stringify(readForm()) });
    if (!res.ok) { document.getElementById("form-error").textContent = (data && data.message) || "Erreur."; document.getElementById("form-error").hidden = false; return; }
    closeDrawer(); load();
  });
}
function openEdit(u) {
  document.getElementById("drawer-content").innerHTML = `<h2>${escapeHtml(u.first_name)} ${escapeHtml(u.last_name)}</h2>` + formHtml(u, true);
  openDrawer();
  document.getElementById("save-btn").addEventListener("click", async () => {
    const { res, data } = await adminApi("/api/admin/users?id=" + u.id, { method: "PUT", body: JSON.stringify(readForm()) });
    if (!res.ok) { document.getElementById("form-error").textContent = (data && data.message) || "Erreur."; document.getElementById("form-error").hidden = false; return; }
    closeDrawer(); load();
  });
}
async function deactivate(id) {
  if (!confirm("Désactiver cet utilisateur ?")) return;
  await adminApi("/api/admin/users?id=" + id, { method: "DELETE" });
  load();
}

async function load() {
  const { data } = await adminApi("/api/admin/users");
  if (!data) return;
  users = data.users;
  const canUpdate = hasPerm(admin, "users.update");
  const canDelete = hasPerm(admin, "users.delete");
  document.getElementById("count-label").textContent = `${users.length} membre(s) de l'équipe`;
  document.getElementById("rows").innerHTML = users.map((u) => `
    <tr>
      <td><strong>${escapeHtml(u.first_name)} ${escapeHtml(u.last_name)}</strong></td>
      <td>${escapeHtml(u.email)}</td>
      <td><span class="badge">${escapeHtml(u.role_label)}</span></td>
      <td><span class="badge ${u.status==="ACTIVE"?"green":u.status==="SUSPENDED"?"red":""}">${u.status}</span></td>
      <td>${u.last_login_at ? formatDate(u.last_login_at) : "Jamais"}</td>
      <td style="text-align:right">
        ${canUpdate ? `<button class="btn btn-outline" style="padding:4px 10px;font-size:.78rem" onclick='openEdit(${JSON.stringify(u).replace(/'/g,"&#39;")})'>Modifier</button>` : ""}
        ${canDelete && u.status === "ACTIVE" ? `<button class="btn btn-danger" style="padding:4px 10px;font-size:.78rem" onclick="deactivate('${u.id}')">Désactiver</button>` : ""}
      </td>
    </tr>`).join("");
}

(async function () {
  admin = await renderShell("/admin/utilisateurs.html", "Utilisateurs");
  if (!admin) return;
  const { data } = await adminApi("/api/admin/lookups");
  lookups = data;
  if (hasPerm(admin, "users.create")) document.getElementById("btn-new").hidden = false;
  document.getElementById("btn-new").addEventListener("click", openNew);
  document.getElementById("drawer-close").addEventListener("click", closeDrawer);
  document.getElementById("drawer-overlay").addEventListener("click", closeDrawer);
  await load();
})();
</script>
</body>
</html>
