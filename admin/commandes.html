<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commandes</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<style>
  .drawer{position:fixed;top:0;right:-460px;width:440px;max-width:92vw;height:100vh;background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.12);transition:right .2s var(--ease);z-index:300;overflow-y:auto;padding:24px}
  .drawer.open{right:0}
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:290;display:none}
  .drawer-overlay.open{display:block}
  .drawer .close{position:absolute;top:20px;right:20px;background:none;border:none;font-size:1.3rem;cursor:pointer}
  .timeline{border-left:2px solid #eee;padding-left:14px;margin-left:4px}
  .timeline .item{margin-bottom:14px}
</style>
</head>
<body>
<template id="page-content">
  <div class="page-head">
    <div><h1>Commandes</h1><p id="count-label"></p></div>
    <button class="btn btn-primary" id="btn-new" hidden>+ Nouvelle commande</button>
  </div>
  <div style="margin-bottom:16px">
    <select id="status-filter" style="padding:9px;border:1px solid #ddd;border-radius:8px">
      <option value="">Tous les statuts</option>
      <option>PENDING</option><option>CONFIRMED</option><option>IN_PROGRESS</option><option>WAITING_PAYMENT</option>
      <option>WAITING_CLIENT</option><option>COMPLETED</option><option>CANCELLED</option>
    </select>
  </div>
  <div class="card" style="padding:0;overflow-x:auto">
    <table>
      <thead><tr><th>Numéro</th><th>Client</th><th>Montant</th><th>Payé</th><th>Statut</th><th>Date</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</template>

<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer"><button class="close" id="drawer-close">✕</button><div id="drawer-content"></div></div>

<script src="js/app.js"></script>
<script>
let admin, lookups;
const STATUSES = ["PENDING","CONFIRMED","IN_PROGRESS","WAITING_PAYMENT","WAITING_CLIENT","COMPLETED","CANCELLED"];
const STATUS_COLOR = { PENDING: "", CONFIRMED: "blue", IN_PROGRESS: "amber", WAITING_PAYMENT: "red", WAITING_CLIENT: "", COMPLETED: "green", CANCELLED: "red" };

function openDrawer() { document.getElementById("drawer").classList.add("open"); document.getElementById("drawer-overlay").classList.add("open"); }
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); document.getElementById("drawer-overlay").classList.remove("open"); }

async function load() {
  const status = document.getElementById("status-filter").value;
  const { data } = await adminApi("/api/admin/orders" + (status ? "?status=" + status : ""));
  if (!data) return;
  document.getElementById("count-label").textContent = `${data.orders.length} commande(s)`;
  document.getElementById("rows").innerHTML = data.orders.length === 0
    ? `<tr><td colspan="6"><div class="empty">Aucune commande trouvée.</div></td></tr>`
    : data.orders.map((o) => `
      <tr style="cursor:pointer" onclick="openOrder('${o.id}')">
        <td><strong>${o.number}</strong></td>
        <td>${escapeHtml(o.first_name)} ${escapeHtml(o.last_name)}</td>
        <td>${formatMoney(o.amount)}</td>
        <td>${formatMoney(o.amount_paid)}</td>
        <td><span class="badge ${STATUS_COLOR[o.status]||""}">${o.status}</span></td>
        <td>${formatDate(o.created_at)}</td>
      </tr>`).join("");
}

async function openOrder(id) {
  const { data } = await adminApi("/api/admin/orders?id=" + id);
  if (!data) return;
  const o = data.order;
  const balance = Number(o.amount) - Number(o.amount_paid);
  const canUpdate = hasPerm(admin, "orders.update");

  document.getElementById("drawer-content").innerHTML = `
    <h2>${o.number}</h2>
    <p style="color:var(--grey-mid);font-size:.85rem">${escapeHtml(o.first_name)} ${escapeHtml(o.last_name)}</p>
    <div class="card" style="margin:14px 0;font-size:.88rem">
      <p>Montant : <strong>${formatMoney(o.amount)}</strong></p>
      <p>Payé : ${formatMoney(o.amount_paid)}</p>
      <p>Solde : <strong style="${balance>0?"color:var(--red)":""}">${formatMoney(balance)}</strong></p>
      <p>Responsable : ${o.assignee_first_name ? escapeHtml(o.assignee_first_name)+" "+escapeHtml(o.assignee_last_name) : "Non assigné"}</p>
      ${o.due_date ? `<p>Date limite : ${formatDate(o.due_date)}</p>` : ""}
    </div>
    ${canUpdate ? `
      <div style="margin:16px 0;padding:14px;background:var(--grey-light);border-radius:8px">
        <label style="font-size:.82rem;font-weight:700;display:block;margin-bottom:6px">Changer le statut</label>
        <select id="new-status" style="width:100%;margin-bottom:8px">${STATUSES.map(s => `<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select>
        <textarea id="status-note" placeholder="Note (optionnel)" rows="2" style="width:100%;margin-bottom:8px"></textarea>
        <button class="btn btn-primary" id="status-save" style="width:100%">Mettre à jour</button>
      </div>` : ""}
    <h3 style="font-size:.88rem">Paiements</h3>
    ${data.payments.length ? data.payments.map(p => `<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:6px 0"><span>${p.number}</span><span>${formatMoney(p.amount, p.currency)}</span></div>`).join("") : '<p class="empty">Aucun</p>'}
    <h3 style="font-size:.88rem;margin-top:14px">Tâches liées</h3>
    ${data.tasks.length ? data.tasks.map(t => `<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:6px 0"><span>${escapeHtml(t.title)}</span><span class="badge">${t.status}</span></div>`).join("") : '<p class="empty">Aucune</p>'}
    <h3 style="font-size:.88rem;margin-top:14px">Timeline</h3>
    <div class="timeline">
      ${data.history.map(h => `<div class="item"><span class="badge ${STATUS_COLOR[h.status]||""}">${h.status}</span><div style="font-size:.78rem;color:var(--grey-mid);margin-top:3px">${formatDate(h.created_at)}</div>${h.note ? `<div style="font-size:.85rem;margin-top:3px">${escapeHtml(h.note)}</div>` : ""}</div>`).join("")}
    </div>
  `;
  openDrawer();

  const saveBtn = document.getElementById("status-save");
  if (saveBtn) saveBtn.addEventListener("click", async () => {
    const { res } = await adminApi("/api/admin/orders?id=" + id, {
      method: "PUT",
      body: JSON.stringify({ status: document.getElementById("new-status").value, note: document.getElementById("status-note").value }),
    });
    if (res.ok) { closeDrawer(); load(); }
  });
}

function openNew() {
  document.getElementById("drawer-content").innerHTML = `
    <h2>Nouvelle commande</h2>
    <div class="form-field"><label>Client *</label><select id="f-client">${lookups.clients.map(c => `<option value="${c.id}">${escapeHtml(c.first_name)} ${escapeHtml(c.last_name)}</option>`).join("")}</select></div>
    <div class="form-field"><label>Demande liée (optionnel)</label><select id="f-request"><option value="">Aucune</option>${lookups.openRequests.map(r => `<option value="${r.id}">${r.number} — ${escapeHtml(r.first_name)} ${escapeHtml(r.last_name)}</option>`).join("")}</select></div>
    <div class="form-field"><label>Montant (HTG) *</label><input id="f-amount" type="number" min="0" step="0.01" required></div>
    <div class="form-row">
      <div class="form-field"><label>Responsable</label><select id="f-assignee"><option value="">Non assigné</option>${lookups.admins.map(a => `<option value="${a.id}">${escapeHtml(a.first_name)} ${escapeHtml(a.last_name)}</option>`).join("")}</select></div>
      <div class="form-field"><label>Date limite</label><input id="f-due" type="date"></div>
    </div>
    <div class="form-field"><label>Notes</label><textarea id="f-notes" rows="3"></textarea></div>
    <button class="btn btn-primary" id="save-btn" style="width:100%">Créer la commande</button>
  `;
  openDrawer();
  document.getElementById("save-btn").addEventListener("click", async () => {
    const { res } = await adminApi("/api/admin/orders", {
      method: "POST",
      body: JSON.stringify({
        clientId: document.getElementById("f-client").value, requestId: document.getElementById("f-request").value,
        amount: document.getElementById("f-amount").value, assigneeId: document.getElementById("f-assignee").value,
        dueDate: document.getElementById("f-due").value, notes: document.getElementById("f-notes").value,
      }),
    });
    if (res.ok) { closeDrawer(); load(); }
  });
}

(async function () {
  admin = await renderShell("/admin/commandes.html", "Commandes");
  if (!admin) return;
  const { data } = await adminApi("/api/admin/lookups");
  lookups = data;
  if (hasPerm(admin, "orders.create")) document.getElementById("btn-new").hidden = false;
  document.getElementById("btn-new").addEventListener("click", openNew);
  document.getElementById("drawer-close").addEventListener("click", closeDrawer);
  document.getElementById("drawer-overlay").addEventListener("click", closeDrawer);
  document.getElementById("status-filter").addEventListener("change", load);
  await load();
})();
</script>
</body>
</html>
