<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paiements</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<style>
  .drawer{position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100vh;background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.12);transition:right .2s var(--ease);z-index:300;overflow-y:auto;padding:24px}
  .drawer.open{right:0}
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:290;display:none}
  .drawer-overlay.open{display:block}
  .drawer .close{position:absolute;top:20px;right:20px;background:none;border:none;font-size:1.3rem;cursor:pointer}
</style>
</head>
<body>
<template id="page-content">
  <div class="page-head">
    <div><h1>Paiements</h1><p id="count-label"></p></div>
    <button class="btn btn-primary" id="btn-new" hidden>+ Enregistrer un paiement</button>
  </div>
  <div class="card" style="padding:0;overflow-x:auto">
    <table>
      <thead><tr><th>Numéro</th><th>Client</th><th>Commande</th><th>Méthode</th><th>Montant</th><th>Statut</th><th>Date</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</template>

<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer"><button class="close" id="drawer-close">✕</button><div id="drawer-content"></div></div>

<script src="js/app.js"></script>
<script>
let admin, lookups;
const METHODS = { CASH: "Espèces", BANK_TRANSFER: "Virement bancaire", MONCASH: "MonCash", NATCASH: "NatCash", CARD: "Carte", OTHER: "Autre" };

function openDrawer() { document.getElementById("drawer").classList.add("open"); document.getElementById("drawer-overlay").classList.add("open"); }
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); document.getElementById("drawer-overlay").classList.remove("open"); }

async function load() {
  const { data } = await adminApi("/api/admin/payments");
  if (!data) return;
  document.getElementById("count-label").textContent = `${data.payments.length} paiement(s)`;
  document.getElementById("rows").innerHTML = data.payments.length === 0
    ? `<tr><td colspan="7"><div class="empty">Aucun paiement enregistré.</div></td></tr>`
    : data.payments.map((p) => `
      <tr>
        <td><strong>${p.number}</strong></td>
        <td>${escapeHtml(p.first_name)} ${escapeHtml(p.last_name)}</td>
        <td>${p.order_number || "-"}</td>
        <td><span class="badge">${METHODS[p.method] || p.method}</span></td>
        <td><strong>${formatMoney(p.amount, p.currency)}</strong></td>
        <td><span class="badge ${p.status==="CONFIRMED"?"green":p.status==="CANCELLED"?"red":""}">${p.status}</span></td>
        <td>${formatDate(p.created_at)}</td>
      </tr>`).join("");
}

function openNew() {
  document.getElementById("drawer-content").innerHTML = `
    <h2>Enregistrer un paiement</h2>
    <div class="form-field"><label>Client *</label><select id="f-client">${lookups.clients.map(c => `<option value="${c.id}">${escapeHtml(c.first_name)} ${escapeHtml(c.last_name)}</option>`).join("")}</select></div>
    <div class="form-field"><label>Commande liée (optionnel)</label><select id="f-order"><option value="">Aucune</option></select></div>
    <div class="form-row">
      <div class="form-field"><label>Montant *</label><input id="f-amount" type="number" min="0.01" step="0.01" required></div>
      <div class="form-field"><label>Devise</label><select id="f-currency"><option value="HTG">HTG</option><option value="USD">USD</option></select></div>
    </div>
    <div class="form-field"><label>Méthode *</label><select id="f-method">${Object.entries(METHODS).map(([k,v]) => `<option value="${k}">${v}</option>`).join("")}</select></div>
    <div class="form-field"><label>Référence (optionnel)</label><input id="f-reference"></div>
    <button class="btn btn-primary" id="save-btn" style="width:100%">Enregistrer</button>
  `;
  openDrawer();

  async function refreshOrders(clientId) {
    const { data } = await adminApi("/api/admin/orders");
    const sel = document.getElementById("f-order");
    const filtered = (data ? data.orders : []).filter(o => !clientId || true); // liste complete, filtrage cote utilisateur simple
    sel.innerHTML = '<option value="">Aucune</option>' + filtered.map(o => `<option value="${o.id}">${o.number} — ${escapeHtml(o.first_name)} ${escapeHtml(o.last_name)}</option>`).join("");
  }
  refreshOrders();

  document.getElementById("save-btn").addEventListener("click", async () => {
    const { res } = await adminApi("/api/admin/payments", {
      method: "POST",
      body: JSON.stringify({
        clientId: document.getElementById("f-client").value, orderId: document.getElementById("f-order").value,
        amount: document.getElementById("f-amount").value, currency: document.getElementById("f-currency").value,
        method: document.getElementById("f-method").value, reference: document.getElementById("f-reference").value,
      }),
    });
    if (res.ok) { closeDrawer(); load(); }
  });
}

(async function () {
  admin = await renderShell("/admin/paiements.html", "Paiements");
  if (!admin) return;
  const { data } = await adminApi("/api/admin/lookups");
  lookups = data;
  if (hasPerm(admin, "payments.create")) document.getElementById("btn-new").hidden = false;
  document.getElementById("btn-new").addEventListener("click", openNew);
  document.getElementById("drawer-close").addEventListener("click", closeDrawer);
  document.getElementById("drawer-overlay").addEventListener("click", closeDrawer);
  await load();
})();
</script>
</body>
</html>
