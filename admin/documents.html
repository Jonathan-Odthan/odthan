<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documents</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<style>
  .drawer{position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100vh;background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.12);transition:right .2s var(--ease);z-index:300;overflow-y:auto;padding:24px}
  .drawer.open{right:0}
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:290;display:none}
  .drawer-overlay.open{display:block}
  .drawer .close{position:absolute;top:20px;right:20px;background:none;border:none;font-size:1.3rem;cursor:pointer}
</style>
</head>
<body>
<template id="page-content">
  <div class="page-head">
    <div><h1>Documents</h1><p id="count-label"></p></div>
    <button class="btn btn-primary" id="btn-new" hidden>+ Ajouter un document</button>
  </div>
  <p class="alert error" id="storage-warning" hidden></p>
  <div class="card" style="padding:0;overflow-x:auto">
    <table>
      <thead><tr><th>Nom</th><th>Type</th><th>Lié à</th><th>Ajouté par</th><th>Date</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</template>

<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer"><button class="close" id="drawer-close">✕</button><div id="drawer-content"></div></div>

<script src="js/app.js"></script>
<script>
let admin, lookups;
function openDrawer() { document.getElementById("drawer").classList.add("open"); document.getElementById("drawer-overlay").classList.add("open"); }
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); document.getElementById("drawer-overlay").classList.remove("open"); }

async function load() {
  const { data } = await adminApi("/api/admin/documents");
  if (!data) return;
  const canDelete = hasPerm(admin, "documents.delete");
  document.getElementById("count-label").textContent = `${data.documents.length} document(s) — stockage privé, accès contrôlé`;
  document.getElementById("rows").innerHTML = data.documents.length === 0
    ? `<tr><td colspan="6"><div class="empty">Aucun document.</div></td></tr>`
    : data.documents.map((d) => `
      <tr>
        <td><strong>${escapeHtml(d.name)}</strong></td>
        <td><span class="badge">${d.type}</span></td>
        <td>${d.first_name ? escapeHtml(d.first_name)+" "+escapeHtml(d.last_name) : (d.order_number || "-")}</td>
        <td>${escapeHtml(d.uploaded_first_name || "-")}</td>
        <td>${formatDate(d.created_at)}</td>
        <td style="text-align:right">
          <a class="btn btn-outline" href="/api/admin/documents-download?id=${d.id}" style="padding:4px 10px;font-size:.78rem">Télécharger</a>
          ${canDelete ? `<button class="btn btn-danger" style="padding:4px 10px;font-size:.78rem" onclick="del('${d.id}')">Supprimer</button>` : ""}
        </td>
      </tr>`).join("");
}

async function del(id) {
  if (!confirm("Supprimer ce document ?")) return;
  await adminApi("/api/admin/documents?id=" + id, { method: "DELETE" });
  load();
}

function openNew() {
  document.getElementById("drawer-content").innerHTML = `
    <h2>Ajouter un document</h2>
    <div class="alert error" id="upload-error" hidden></div>
    <div class="form-field"><label>Fichier * (PDF, image, Word, Excel — 15 Mo max)</label><input type="file" id="f-file" required></div>
    <div class="form-field"><label>Type *</label><select id="f-type">
      <option value="CLIENT">Document client</option><option value="COMPANY">Document entreprise</option>
      <option value="CONTRACT">Contrat</option><option value="INVOICE">Facture</option>
      <option value="WORK_FILE">Fichier de travail</option><option value="FINAL_DELIVERABLE">Livrable final</option>
    </select></div>
    <div class="form-field"><label>Client lié (optionnel)</label><select id="f-client"><option value="">Aucun</option>${lookups.clients.map(c => `<option value="${c.id}">${escapeHtml(c.first_name)} ${escapeHtml(c.last_name)}</option>`).join("")}</select></div>
    <button class="btn btn-primary" id="save-btn" style="width:100%">Téléverser</button>
  `;
  openDrawer();
  document.getElementById("save-btn").addEventListener("click", async () => {
    const fileInput = document.getElementById("f-file");
    if (!fileInput.files[0]) return;
    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("type", document.getElementById("f-type").value);
    formData.append("clientId", document.getElementById("f-client").value);

    const csrf = getCookie("odthan_csrf");
    const res = await fetch("/api/admin/documents", { method: "POST", body: formData, credentials: "include", headers: csrf ? { "X-CSRF-Token": csrf } : {} });
    const data = await res.json().catch(() => null);
    if (!res.ok) {
      const el = document.getElementById("upload-error");
      el.textContent = (data && data.message) || "Échec du téléversement.";
      el.hidden = false;
      return;
    }
    closeDrawer(); load();
  });
}

(async function () {
  admin = await renderShell("/admin/documents.html", "Documents");
  if (!admin) return;
  const { data } = await adminApi("/api/admin/lookups");
  lookups = data;
  if (hasPerm(admin, "documents.upload")) document.getElementById("btn-new").hidden = false;
  document.getElementById("btn-new").addEventListener("click", openNew);
  document.getElementById("drawer-close").addEventListener("click", closeDrawer);
  document.getElementById("drawer-overlay").addEventListener("click", closeDrawer);
  await load();
})();
</script>
</body>
</html>
