<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sécurité</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<template id="page-content">
  <div class="page-head"><div><h1>Sécurité</h1><p>Mot de passe et sessions</p></div></div>
  <div style="max-width:520px;display:flex;flex-direction:column;gap:16px">
    <div class="card">
      <h2 style="font-size:.95rem;margin-top:0">Changer mon mot de passe</h2>
      <div class="alert error" id="pw-error" hidden></div>
      <div class="alert success" id="pw-success" hidden></div>
      <div class="form-field"><label>Mot de passe actuel</label><input id="current-password" type="password" required></div>
      <div class="form-field"><label>Nouveau mot de passe</label><input id="new-password" type="password" minlength="8" required></div>
      <button class="btn btn-primary" id="save-password" style="width:100%">Mettre à jour</button>
    </div>
    <div class="card">
      <h2 style="font-size:.95rem;margin-top:0">Session</h2>
      <p style="color:var(--grey-mid);font-size:.85rem">Vous êtes connecté sur cet appareil. La gestion de plusieurs sessions actives avec fermeture individuelle n'est pas encore disponible dans cette version — chaque connexion émet une session JWT de 12h sans état stocké côté serveur ; pour forcer une déconnexion partout, changez votre mot de passe.</p>
    </div>
  </div>
</template>

<script src="js/app.js"></script>
<script>
(async function () {
  const admin = await renderShell("/admin/security.html", "Sécurité");
  if (!admin) return;

  document.getElementById("save-password").addEventListener("click", async () => {
    const { res, data } = await adminApi("/api/admin/security?action=change-password", {
      method: "POST",
      body: JSON.stringify({ currentPassword: document.getElementById("current-password").value, newPassword: document.getElementById("new-password").value }),
    });
    const successEl = document.getElementById("pw-success"), errorEl = document.getElementById("pw-error");
    if (res.ok) { successEl.hidden = false; errorEl.hidden = true; document.getElementById("current-password").value = ""; document.getElementById("new-password").value = ""; }
    else { errorEl.textContent = (data && data.message) || "Erreur."; errorEl.hidden = false; successEl.hidden = true; }
  });
})();
</script>
</body>
</html>
