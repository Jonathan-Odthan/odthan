<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facture</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/base.css">
<style>
  body{background:#fff;padding:40px 20px;max-width:680px;margin:0 auto}
  .top{display:flex;justify-content:space-between;align-items:start;margin-bottom:36px}
  .top img{height:32px}
  table{width:100%;border-collapse:collapse;font-size:.92rem;margin:24px 0}
  td{padding:8px 0;border-bottom:1px solid #eee}
  .print-btn{margin-bottom:20px}
  @media print{.print-btn{display:none}}
</style>
</head>
<body>
  <button class="print-btn" onclick="window.print()" style="padding:10px 18px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer">Imprimer / Exporter PDF</button>
  <div id="content">Chargement...</div>
  <p class="print-btn" style="font-size:.78rem;color:var(--grey-mid)">
    Astuce : utilisez "Imprimer" puis "Enregistrer au format PDF" dans votre navigateur.
  </p>

<script src="js/app.js"></script>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get("id");
  const { res, data } = await adminApi("/api/admin/invoices?id=" + id);
  if (!res.ok) { document.getElementById("content").textContent = "Facture introuvable."; return; }
  const i = data.invoice;
  document.getElementById("content").innerHTML = `
    <div class="top">
      <div><img src="/assets/logo-full-trans.png" alt="Odthan"><p style="font-size:.85rem;color:var(--grey-mid)">Odthan Empire<br>odthanempire@gmail.com — www.odthan.com</p></div>
      <div style="text-align:right"><h1 style="font-family:var(--font-display);margin:0">FACTURE</h1><p>${i.number}</p><p style="color:var(--grey-mid);font-size:.85rem">${formatDate(i.issued_at)}</p></div>
    </div>
    <p style="font-size:.75rem;color:var(--grey-mid);text-transform:uppercase">Facture à</p>
    <p><strong>${escapeHtml(i.first_name)} ${escapeHtml(i.last_name)}</strong></p>
    ${i.company ? `<p>${escapeHtml(i.company)}</p>` : ""}
    ${i.email ? `<p>${escapeHtml(i.email)}</p>` : ""}
    ${i.order_number ? `<p style="margin-top:12px;color:var(--grey-mid);font-size:.85rem">Commande liée : ${i.order_number}</p>` : ""}
    <table>
      <tr><td>Sous-total</td><td style="text-align:right">${formatMoney(i.subtotal)}</td></tr>
      <tr><td>Réduction</td><td style="text-align:right">-${formatMoney(i.discount)}</td></tr>
      <tr><td><strong>Total</strong></td><td style="text-align:right"><strong>${formatMoney(i.total)}</strong></td></tr>
      <tr><td>Montant payé</td><td style="text-align:right">${formatMoney(i.amount_paid)}</td></tr>
    </table>
    <p style="font-size:.78rem;color:var(--grey-mid)">Statut : ${i.status}${i.due_date ? ` — Échéance : ${formatDate(i.due_date)}` : ""}</p>
  `;
})();
</script>
</body>
</html>
