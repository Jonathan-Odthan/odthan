<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<style>
  .drawer{position:fixed;top:0;right:-480px;width:460px;max-width:92vw;height:100vh;background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.12);transition:right .2s var(--ease);z-index:300;overflow-y:auto;padding:24px}
  .drawer.open{right:0}
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:290;display:none}
  .drawer-overlay.open{display:block}
  .drawer h2{font-family:var(--font-display);margin:0 0 4px}
  .drawer .close{position:absolute;top:20px;right:20px;background:none;border:none;font-size:1.3rem;cursor:pointer}
</style>
</head>
<body>
<template id="page-content">
  <div class="page-head">
    <div><h1>Clients</h1><p id="count-label"></p></div>
    <button class="btn btn-primary" id="btn-new" hidden>+ Nouveau client</button>
  </div>

  <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
    <input type="search" id="search" placeholder="Rechercher par nom, email, téléphone..." style="flex:1;min-width:220px;padding:9px 12px;border:1px solid #ddd;border-radius:8px">
    <select id="status-filter" style="padding:9px;border:1px solid #ddd;border-radius:8px">
      <option value="">Tous les statuts</option>
      <option value="ACTIVE">Actif</option>
      <option value="INACTIVE">Inactif</option>
    </select>
  </div>

  <div class="card" style="padding:0;overflow-x:auto">
    <table>
      <thead><tr><th>Nom</th><th>Entreprise</th><th>Contact</th><th>Statut</th><th>Créé le</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="pagination"><span id="page-label"></span><div class="btns"><button id="prev">Précédent</button><button id="next">Suivant</button></div></div>
</template>

<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer">
  <button class="close" id="drawer-close">✕</button>
  <div id="drawer-content"></div>
</div>

<script src="js/app.js"></script>
<script>
let admin, page = 1, currentClientId = null;

async function loadList() {
  const q = document.getElementById("search").value.trim();
  const status = document.getElementById("status-filter").value;
  const params = new URLSearchParams({ page, ...(q && { q }), ...(status && { status }) });
  const { data } = await adminApi("/api/admin/clients?" + params);
  if (!data) return;

  document.getElementById("count-label").textContent = `${data.total} client${data.total > 1 ? "s" : ""} enregistré${data.total > 1 ? "s" : ""}`;
  document.getElementById("rows").innerHTML = data.clients.length === 0
    ? `<tr><td colspan="5"><div class="empty">Aucun client trouvé.</div></td></tr>`
    : data.clients.map((c) => `
      <tr style="cursor:pointer" onclick="openClient('${c.id}')">
        <td><strong>${escapeHtml(c.first_name)} ${escapeHtml(c.last_name)}</strong></td>
        <td>${escapeHtml(c.company || "-")}</td>
        <td>${escapeHtml(c.email || c.phone || "-")}</td>
        <td><span class="badge ${c.status === "ACTIVE" ? "green" : ""}">${c.status}</span></td>
        <td>${formatDate(c.created_at)}</td>
      </tr>`).join("");

  const totalPages = Math.max(1, Math.ceil(data.total / data.pageSize));
  document.getElementById("page-label").textContent = `Page ${page} sur ${totalPages}`;
  document.getElementById("prev").disabled = page <= 1;
  document.getElementById("next").disabled = page >= totalPages;
}

function openDrawer() { document.getElementById("drawer").classList.add("open"); document.getElementById("drawer-overlay").classList.add("open"); }
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); document.getElementById("drawer-overlay").classList.remove("open"); currentClientId = null; }

function clientFormHtml(c = {}) {
  return `
    <div class="alert error" id="form-error" hidden></div>
    <div class="form-row">
      <div class="form-field"><label>Prénom *</label><input id="f-firstName" value="${escapeHtml(c.first_name || "")}" required></div>
      <div class="form-field"><label>Nom *</label><input id="f-lastName" value="${escapeHtml(c.last_name || "")}" required></div>
    </div>
    <div class="form-field"><label>Entreprise</label><input id="f-company" value="${escapeHtml(c.company || "")}"></div>
    <div class="form-row">
      <div class="form-field"><label>Email</label><input id="f-email" type="email" value="${escapeHtml(c.email || "")}"></div>
      <div class="form-field"><label>Téléphone</label><input id="f-phone" value="${escapeHtml(c.phone || "")}"></div>
    </div>
    <div class="form-row">
      <div class="form-field"><label>WhatsApp</label><input id="f-whatsapp" value="${escapeHtml(c.whatsapp || "")}"></div>
      <div class="form-field"><label>Statut</label><select id="f-status"><option value="ACTIVE" ${c.status !== "INACTIVE" ? "selected" : ""}>Actif</option><option value="INACTIVE" ${c.status === "INACTIVE" ? "selected" : ""}>Inactif</option></select></div>
    </div>
    <div class="form-field"><label>Adresse</label><input id="f-address" value="${escapeHtml(c.address || "")}"></div>
    <div class="form-row">
      <div class="form-field"><label>Pays</label><input id="f-country" value="${escapeHtml(c.country || "")}"></div>
      <div class="form-field"><label>Ville</label><input id="f-city" value="${escapeHtml(c.city || "")}"></div>
    </div>
    <div class="form-field"><label>Notes internes</label><textarea id="f-notes" rows="3">${escapeHtml(c.notes || "")}</textarea></div>
    <button class="btn btn-primary" id="save-btn" style="width:100%">Enregistrer</button>
  `;
}

function readClientForm() {
  return {
    firstName: document.getElementById("f-firstName").value,
    lastName: document.getElementById("f-lastName").value,
    company: document.getElementById("f-company").value,
    email: document.getElementById("f-email").value,
    phone: document.getElementById("f-phone").value,
    whatsapp: document.getElementById("f-whatsapp").value,
    status: document.getElementById("f-status").value,
    address: document.getElementById("f-address").value,
    country: document.getElementById("f-country").value,
    city: document.getElementById("f-city").value,
    notes: document.getElementById("f-notes").value,
  };
}

function openNewClient() {
  document.getElementById("drawer-content").innerHTML = `<h2>Nouveau client</h2><p style="color:var(--grey-mid);font-size:.85rem;margin-bottom:18px">Ajouter une fiche client</p>` + clientFormHtml();
  openDrawer();
  document.getElementById("save-btn").addEventListener("click", async () => {
    const { res, data } = await adminApi("/api/admin/clients", { method: "POST", body: JSON.stringify(readClientForm()) });
    if (!res.ok) return showFormError(data);
    closeDrawer(); loadList();
  });
}

async function openClient(id) {
  currentClientId = id;
  const { data } = await adminApi("/api/admin/clients?id=" + id);
  if (!data) return;
  const c = data.client;
  const canEdit = hasPerm(admin, "clients.update");

  document.getElementById("drawer-content").innerHTML = `
    <h2>${escapeHtml(c.first_name)} ${escapeHtml(c.last_name)}</h2>
    <p style="color:var(--grey-mid);font-size:.85rem;margin-bottom:18px">${escapeHtml(c.company || "")}</p>
    ${canEdit ? `<div id="edit-zone">${clientFormHtml(c)}</div>` : ""}
    ${hasPerm(admin, "clients.delete") && c.status === "ACTIVE" ? `<button class="btn btn-danger" id="deactivate-btn" style="width:100%;margin-top:10px">Désactiver ce client</button>` : ""}
    <hr style="margin:20px 0;border:none;border-top:1px solid #eee">
    <h3 style="font-size:.9rem">Commandes</h3>
    ${data.orders.length ? data.orders.map(o => `<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:6px 0"><span>${o.number}</span><span>${formatMoney(o.amount)} — ${o.status}</span></div>`).join("") : '<p class="empty">Aucune</p>'}
    <h3 style="font-size:.9rem;margin-top:16px">Demandes</h3>
    ${data.requests.length ? data.requests.map(r => `<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:6px 0"><span>${r.number} — ${escapeHtml(r.service_name || "")}</span><span>${r.status}</span></div>`).join("") : '<p class="empty">Aucune</p>'}
    <h3 style="font-size:.9rem;margin-top:16px">Paiements</h3>
    ${data.payments.length ? data.payments.map(p => `<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:6px 0"><span>${p.number}</span><span>${formatMoney(p.amount, p.currency)}</span></div>`).join("") : '<p class="empty">Aucun</p>'}
  `;
  openDrawer();

  if (canEdit) {
    document.getElementById("save-btn").addEventListener("click", async () => {
      const { res, data: resp } = await adminApi("/api/admin/clients?id=" + id, { method: "PUT", body: JSON.stringify(readClientForm()) });
      if (!res.ok) return showFormError(resp);
      closeDrawer(); loadList();
    });
  }
  const deactivateBtn = document.getElementById("deactivate-btn");
  if (deactivateBtn) {
    deactivateBtn.addEventListener("click", async () => {
      if (!confirm("Désactiver ce client ?")) return;
      await adminApi("/api/admin/clients?id=" + id, { method: "DELETE" });
      closeDrawer(); loadList();
    });
  }
}

function showFormError(data) {
  const el = document.getElementById("form-error");
  if (el) { el.textContent = "Vérifiez les champs du formulaire."; el.hidden = false; }
}

(async function () {
  admin = await renderShell("/admin/clients.html", "Clients");
  if (!admin) return;
  if (hasPerm(admin, "clients.create")) document.getElementById("btn-new").hidden = false;

  document.getElementById("btn-new").addEventListener("click", openNewClient);
  document.getElementById("drawer-close").addEventListener("click", closeDrawer);
  document.getElementById("drawer-overlay").addEventListener("click", closeDrawer);
  document.getElementById("prev").addEventListener("click", () => { if (page > 1) { page--; loadList(); } });
  document.getElementById("next").addEventListener("click", () => { page++; loadList(); });
  let searchTimer;
  document.getElementById("search").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(() => { page = 1; loadList(); }, 350); });
  document.getElementById("status-filter").addEventListener("change", () => { page = 1; loadList(); });

  await loadList();
})();
</script>
</body>
</html>
