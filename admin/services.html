<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<style>
  .drawer{position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100vh;background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.12);transition:right .2s var(--ease);z-index:300;overflow-y:auto;padding:24px}
  .drawer.open{right:0}
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:290;display:none}
  .drawer-overlay.open{display:block}
  .drawer .close{position:absolute;top:20px;right:20px;background:none;border:none;font-size:1.3rem;cursor:pointer}
</style>
</head>
<body>
<template id="page-content">
  <div class="page-head">
    <div><h1>Services</h1><p id="count-label"></p></div>
    <button class="btn btn-primary" id="btn-new" hidden>+ Nouveau service</button>
  </div>
  <div class="grid grid-3" id="cards"></div>
</template>

<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer">
  <button class="close" id="drawer-close">✕</button>
  <div id="drawer-content"></div>
</div>

<script src="js/app.js"></script>
<script>
let admin, services = [];

function formHtml(s = {}) {
  return `
    <div class="form-field"><label>Nom *</label><input id="f-name" value="${escapeHtml(s.name || "")}" required></div>
    <div class="form-field"><label>Description</label><textarea id="f-description" rows="3">${escapeHtml(s.description || "")}</textarea></div>
    <div class="form-row">
      <div class="form-field"><label>Prix (HTG) *</label><input id="f-price" type="number" min="0" step="0.01" value="${s.price || 0}" required></div>
      <div class="form-field"><label>Statut</label><select id="f-status"><option value="ACTIVE" ${s.status !== "INACTIVE" ? "selected" : ""}>Actif</option><option value="INACTIVE" ${s.status === "INACTIVE" ? "selected" : ""}>Inactif</option></select></div>
    </div>
    <button class="btn btn-primary" id="save-btn" style="width:100%">Enregistrer</button>
  `;
}
function readForm() {
  return {
    name: document.getElementById("f-name").value,
    description: document.getElementById("f-description").value,
    price: document.getElementById("f-price").value,
    status: document.getElementById("f-status").value,
  };
}
function openDrawer() { document.getElementById("drawer").classList.add("open"); document.getElementById("drawer-overlay").classList.add("open"); }
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); document.getElementById("drawer-overlay").classList.remove("open"); }

function openNew() {
  document.getElementById("drawer-content").innerHTML = `<h2>Nouveau service</h2>` + formHtml();
  openDrawer();
  document.getElementById("save-btn").addEventListener("click", async () => {
    const { res } = await adminApi("/api/admin/services", { method: "POST", body: JSON.stringify(readForm()) });
    if (res.ok) { closeDrawer(); load(); }
  });
}
function openEdit(s) {
  document.getElementById("drawer-content").innerHTML = `<h2>${escapeHtml(s.name)}</h2>` + formHtml(s);
  openDrawer();
  document.getElementById("save-btn").addEventListener("click", async () => {
    const { res } = await adminApi("/api/admin/services?id=" + s.id, { method: "PUT", body: JSON.stringify(readForm()) });
    if (res.ok) { closeDrawer(); load(); }
  });
}
async function toggleStatus(id, current) {
  const next = current === "ACTIVE" ? "INACTIVE" : "ACTIVE";
  await adminApi(`/api/admin/services?id=${id}&status=${next}`, { method: "DELETE" });
  load();
}

async function load() {
  const { data } = await adminApi("/api/admin/services");
  if (!data) return;
  services = data.services;
  document.getElementById("count-label").textContent = `${services.length} service(s) Odthan Empire`;
  const canUpdate = hasPerm(admin, "services.update");
  document.getElementById("cards").innerHTML = services.map((s) => `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:start">
        <strong>${escapeHtml(s.name)}</strong>
        <span class="badge ${s.status === "ACTIVE" ? "green" : ""}">${s.status}</span>
      </div>
      <p style="color:var(--grey-mid);font-size:.85rem;margin:8px 0">${escapeHtml(s.description || "")}</p>
      <p style="font-size:1.15rem;font-weight:800">${formatMoney(s.price)}</p>
      <p style="font-size:.75rem;color:var(--grey-mid)">${s.request_count} demande(s)</p>
      ${canUpdate ? `
        <div style="display:flex;gap:8px;margin-top:10px">
          <button class="btn btn-outline" onclick='openEdit(${JSON.stringify(s).replace(/'/g, "&#39;")})'>Modifier</button>
          <button class="btn btn-outline" onclick="toggleStatus('${s.id}','${s.status}')">${s.status === "ACTIVE" ? "Désactiver" : "Activer"}</button>
        </div>` : ""}
    </div>`).join("") || '<div class="empty">Aucun service configuré.</div>';
}

(async function () {
  admin = await renderShell("/admin/services.html", "Services");
  if (!admin) return;
  if (hasPerm(admin, "services.create")) document.getElementById("btn-new").hidden = false;
  document.getElementById("btn-new").addEventListener("click", openNew);
  document.getElementById("drawer-close").addEventListener("click", closeDrawer);
  document.getElementById("drawer-overlay").addEventListener("click", closeDrawer);
  await load();
})();
</script>
</body>
</html>
