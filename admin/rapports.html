<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rapports</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<template id="page-content">
  <div class="page-head">
    <div><h1>Rapports</h1><p>Statistiques calculées depuis la base de données</p></div>
    <a class="btn btn-outline" id="export-link" href="#">Exporter en CSV</a>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px" id="period-btns"></div>
  <div class="grid grid-4" id="stats" style="margin-bottom:20px"></div>
  <div class="card">
    <h3 style="margin-top:0;font-size:.9rem">Services les plus demandés (période)</h3>
    <div id="by-service"></div>
  </div>
</template>

<script src="js/app.js"></script>
<script>
let period = "30d";
const PERIODS = [["today","Aujourd'hui"],["7d","7 jours"],["30d","30 jours"],["3m","3 mois"],["year","Année"]];

function renderPeriodBtns() {
  document.getElementById("period-btns").innerHTML = PERIODS.map(([k,l]) => `<button class="btn ${k===period?"btn-primary":"btn-outline"}" onclick="setPeriod('${k}')">${l}</button>`).join("");
  document.getElementById("export-link").href = "/api/admin/reports-export?period=" + period;
}
function setPeriod(p) { period = p; renderPeriodBtns(); load(); }

async function load() {
  const { data } = await adminApi("/api/admin/reports?period=" + period);
  if (!data) return;
  document.getElementById("stats").innerHTML = [
    ["💰","Revenus",formatMoney(data.revenue)],["💳","Paiements",data.paymentsCount],
    ["📦","Commandes",data.ordersCount],["📥","Demandes",data.requestsCount],
  ].map(([icon,label,value]) => `<div class="card stat"><div class="icon">${icon}</div><div><div class="label">${label}</div><div class="value">${value}</div></div></div>`).join("");

  document.getElementById("by-service").innerHTML = data.byService.length === 0
    ? '<p class="empty">Aucune donnée sur cette période.</p>'
    : data.byService.map(s => `<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:.9rem"><span>${escapeHtml(s.name)}</span><strong>${s.total}</strong></div>`).join("");
}

(async function () {
  const admin = await renderShell("/admin/rapports.html", "Rapports");
  if (!admin) return;
  renderPeriodBtns();
  await load();
})();
</script>
</body>
</html>
