<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Logs</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<template id="page-content">
  <div class="page-head"><div><h1>Audit Logs</h1><p>Journal en lecture seule — non modifiable par les utilisateurs standards</p></div></div>
  <div style="margin-bottom:16px">
    <select id="module-filter" style="padding:9px;border:1px solid #ddd;border-radius:8px">
      <option value="">Tous les modules</option>
    </select>
  </div>
  <div class="card" style="padding:0;overflow-x:auto">
    <table>
      <thead><tr><th>Utilisateur</th><th>Action</th><th>Module</th><th>Résultat</th><th>IP</th><th>Date</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div class="pagination"><span id="page-label"></span><div class="btns"><button id="prev">Précédent</button><button id="next">Suivant</button></div></div>
</template>

<script src="js/app.js"></script>
<script>
let page = 1, modulesLoaded = false;

async function load() {
  const module = document.getElementById("module-filter").value;
  const params = new URLSearchParams({ page, ...(module && { module }) });
  const { data } = await adminApi("/api/admin/audit-logs?" + params);
  if (!data) return;

  if (!modulesLoaded) {
    const sel = document.getElementById("module-filter");
    data.modules.forEach(m => { const o = document.createElement("option"); o.value = m; o.textContent = m; sel.appendChild(o); });
    modulesLoaded = true;
  }

  document.getElementById("rows").innerHTML = data.logs.length === 0
    ? `<tr><td colspan="6"><div class="empty">Aucune entrée d'audit.</div></td></tr>`
    : data.logs.map((l) => `
      <tr>
        <td>${l.first_name ? escapeHtml(l.first_name)+" "+escapeHtml(l.last_name) : (l.actor_type === "client" ? "Client" : "Système")}</td>
        <td><strong>${l.action}</strong></td>
        <td>${l.module}</td>
        <td><span class="badge ${l.result==="SUCCESS"?"green":"red"}">${l.result}</span></td>
        <td>${l.ip || "-"}</td>
        <td>${formatDate(l.created_at)}</td>
      </tr>`).join("");

  const totalPages = Math.max(1, Math.ceil(data.total / data.pageSize));
  document.getElementById("page-label").textContent = `Page ${page} sur ${totalPages}`;
  document.getElementById("prev").disabled = page <= 1;
  document.getElementById("next").disabled = page >= totalPages;
}

(async function () {
  const admin = await renderShell("/admin/audit-logs.html", "Audit Logs");
  if (!admin) return;
  document.getElementById("module-filter").addEventListener("change", () => { page = 1; load(); });
  document.getElementById("prev").addEventListener("click", () => { if (page > 1) { page--; load(); } });
  document.getElementById("next").addEventListener("click", () => { page++; load(); });
  await load();
})();
</script>
</body>
</html>
