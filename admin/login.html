<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — Odthan Admin Center</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/base.css">
<style>
  body{margin:0;background:#000;display:flex;min-height:100vh;font-family:var(--font-body)}
  .side{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:56px;color:#fff}
  .side img{height:26px}
  .side h1{font-family:var(--font-display);font-size:2rem;line-height:1.15;margin:0}
  .side h1 span{color:var(--red)}
  .side p{color:#999;max-width:360px}
  .panel{width:420px;background:#fff;display:flex;align-items:center;justify-content:center;padding:40px}
  .panel-inner{width:100%;max-width:320px}
  .panel h2{font-family:var(--font-display);font-size:1.4rem;margin:0 0 4px}
  .panel p.sub{color:var(--grey-mid);font-size:.88rem;margin:0 0 24px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:.85rem;font-weight:700;margin-bottom:6px}
  .field input{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:6px;font-size:.95rem}
  .btn-primary{width:100%;padding:12px;background:#000;color:#fff;border:none;border-radius:6px;font-weight:700;cursor:pointer}
  .btn-primary:disabled{opacity:.6;cursor:wait}
  .alert{background:#FDEEEE;color:#B3261E;padding:10px 12px;border-radius:6px;font-size:.85rem;margin-bottom:16px}
  @media(max-width:760px){.side{display:none}.panel{width:100%}}
</style>
</head>
<body>
  <div class="side">
    <img src="/assets/logo-full-trans.png" alt="Odthan" style="filter:invert(1)">
    <div>
      <h1>ODTHAN <span>ADMIN CENTER</span></h1>
      <p>Gérez clients, services, commandes, paiements et documents depuis une seule interface.</p>
    </div>
    <p style="color:#666;font-size:.8rem">www.odthan.com</p>
  </div>
  <div class="panel">
    <div class="panel-inner">
      <h2>Connexion</h2>
      <p class="sub">Accès réservé à l'équipe Odthan.</p>
      <p class="alert" id="error" hidden></p>
      <form id="login-form" novalidate>
        <div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
        <div class="field"><label for="password">Mot de passe</label><input id="password" type="password" required autocomplete="current-password"></div>
        <button class="btn-primary" type="submit">Se connecter</button>
      </form>
    </div>
  </div>

<script src="js/app.js"></script>
<script>
  const form = document.getElementById("login-form");
  const errorEl = document.getElementById("error");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorEl.hidden = true;
    const btn = form.querySelector("button");
    btn.disabled = true;
    const { res, data } = await adminApi("/api/admin/login", {
      method: "POST",
      body: JSON.stringify({ email: document.getElementById("email").value, password: document.getElementById("password").value }),
    });
    btn.disabled = false;
    if (!res.ok) {
      errorEl.textContent = (data && data.message) || "Connexion impossible.";
      errorEl.hidden = false;
      return;
    }
    window.location.href = "/admin/dashboard.html";
  });
</script>
</body>
</html>
