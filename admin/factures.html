<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factures</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<style>
  .drawer{position:fixed;top:0;right:-420px;width:400px;max-width:92vw;height:100vh;background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.12);transition:right .2s var(--ease);z-index:300;overflow-y:auto;padding:24px}
  .drawer.open{right:0}
  .drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:290;display:none}
  .drawer-overlay.open{display:block}
  .drawer .close{position:absolute;top:20px;right:20px;background:none;border:none;font-size:1.3rem;cursor:pointer}
</style>
</head>
<body>
<template id="page-content">
  <div class="page-head">
    <div><h1>Factures</h1><p id="count-label"></p></div>
    <button class="btn btn-primary" id="btn-new" hidden>+ Nouvelle facture</button>
  </div>
  <div class="card" style="padding:0;overflow-x:auto">
    <table>
      <thead><tr><th>Numéro</th><th>Client</th><th>Total</th><th>Statut</th><th>Date</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</template>

<div class="drawer-overlay" id="drawer-overlay"></div>
<div class="drawer" id="drawer"><button class="close" id="drawer-close">✕</button><div id="drawer-content"></div></div>

<script src="js/app.js"></script>
<script>
let admin, lookups;

async function load() {
  const { data } = await adminApi("/api/admin/invoices");
  if (!data) return;
  document.getElementById("count-label").textContent = `${data.invoices.length} facture(s)`;
  document.getElementById("rows").innerHTML = data.invoices.length === 0
    ? `<tr><td colspan="5"><div class="empty">Aucune facture générée.</div></td></tr>`
    : data.invoices.map((i) => `
      <tr style="cursor:pointer" onclick="window.open('facture-imprimer.html?id=${i.id}','_blank')">
        <td><strong>${i.number}</strong></td>
        <td>${escapeHtml(i.first_name)} ${escapeHtml(i.last_name)}</td>
        <td><strong>${formatMoney(i.total)}</strong></td>
        <td><span class="badge ${i.status==="PAID"?"green":i.status==="CANCELLED"?"red":""}">${i.status}</span></td>
        <td>${formatDate(i.issued_at)}</td>
      </tr>`).join("");
}

function openNew() {
  document.getElementById("drawer-content").innerHTML = `
    <h2>Nouvelle facture</h2>
    <div class="form-field"><label>Client *</label><select id="f-client">${lookups.clients.map(c => `<option value="${c.id}">${escapeHtml(c.first_name)} ${escapeHtml(c.last_name)}</option>`).join("")}</select></div>
    <div class="form-field"><label>Commande liée (optionnel)</label><select id="f-order"><option value="">Aucune</option></select></div>
    <div class="form-row">
      <div class="form-field"><label>Sous-total *</label><input id="f-subtotal" type="number" min="0" step="0.01" required></div>
      <div class="form-field"><label>Réduction</label><input id="f-discount" type="number" min="0" step="0.01" value="0"></div>
    </div>
    <div class="form-field"><label>Date d'échéance</label><input id="f-due" type="date"></div>
    <button class="btn btn-primary" id="save-btn" style="width:100%">Générer la facture</button>
  `;
  openDrawer();
  adminApi("/api/admin/orders").then(({ data }) => {
    const sel = document.getElementById("f-order");
    sel.innerHTML = '<option value="">Aucune</option>' + (data ? data.orders : []).map(o => `<option value="${o.id}">${o.number} — ${escapeHtml(o.first_name)} ${escapeHtml(o.last_name)} (${formatMoney(o.amount)})</option>`).join("");
  });
  document.getElementById("save-btn").addEventListener("click", async () => {
    const { res, data } = await adminApi("/api/admin/invoices", {
      method: "POST",
      body: JSON.stringify({
        clientId: document.getElementById("f-client").value, orderId: document.getElementById("f-order").value,
        subtotal: document.getElementById("f-subtotal").value, discount: document.getElementById("f-discount").value,
        dueDate: document.getElementById("f-due").value,
      }),
    });
    if (res.ok) { closeDrawer(); load(); window.open("facture-imprimer.html?id=" + data.id, "_blank"); }
  });
}
function openDrawer() { document.getElementById("drawer").classList.add("open"); document.getElementById("drawer-overlay").classList.add("open"); }
function closeDrawer() { document.getElementById("drawer").classList.remove("open"); document.getElementById("drawer-overlay").classList.remove("open"); }

(async function () {
  admin = await renderShell("/admin/factures.html", "Factures");
  if (!admin) return;
  const { data } = await adminApi("/api/admin/lookups");
  lookups = data;
  if (hasPerm(admin, "invoices.create")) document.getElementById("btn-new").hidden = false;
  document.getElementById("btn-new").addEventListener("click", openNew);
  document.getElementById("drawer-close").addEventListener("click", closeDrawer);
  document.getElementById("drawer-overlay").addEventListener("click", closeDrawer);
  await load();
})();
</script>
</body>
</html>
